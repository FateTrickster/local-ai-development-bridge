<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local AI Bridge · Task Monitor</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg:#f6f7f9; --panel:#fff; --soft:#f1f3f5; --text:#17191c; --muted:#737a84;
      --border:#dfe3e8; --green:#18864b; --green-soft:#e9f7ef; --blue:#3157d5; --red:#b42318;
      --shadow:0 1px 2px rgba(0,0,0,.035);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111315; --panel:#181b1f; --soft:#20242a; --text:#eef1f4; --muted:#9da5af;
        --border:#30363d; --green:#55c78c; --green-soft:#183326; --blue:#84a0ff; --red:#ff7a70; --shadow:none; }
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
    main { max-width:1180px; margin:0 auto; padding:22px; }
    h1,h2,p { margin:0; }
    .top { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:16px; }
    h1 { font-size:22px; font-weight:720; }
    .subtitle { margin-top:4px; color:var(--muted); }
    .live { display:flex; align-items:center; gap:8px; color:var(--muted); white-space:nowrap; }
    .dot { width:9px; height:9px; border-radius:50%; background:var(--green); }
    .grid3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    .panel,.metric { background:var(--panel); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); }
    .metric { padding:14px 15px; min-height:96px; }
    .label { color:var(--muted); font-size:12px; }
    .metric .value { font-size:23px; font-weight:760; margin-top:7px; line-height:1.2; }
    .metric .detail { color:var(--muted); font-size:12px; margin-top:6px; }
    .section { margin-top:12px; padding:15px; }
    .section-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; }
    .section-head h2 { font-size:15px; }
    .small { color:var(--muted); font-size:12px; }
    .stage { padding:13px 14px; background:var(--soft); border-radius:10px; min-width:0; }
    .stage.active { outline:1px solid color-mix(in srgb,var(--green) 55%,var(--border)); }
    .stage .name { font-weight:650; margin-top:4px; overflow-wrap:anywhere; }
    .stage .time { font-size:20px; font-weight:730; margin-top:8px; font-variant-numeric:tabular-nums; }
    .tree { display:flex; flex-direction:column; gap:6px; }
    .tree-node { position:relative; }
    .task-row { display:grid; grid-template-columns:24px minmax(0,1fr) auto; gap:9px; align-items:start; padding:9px 10px; border-radius:9px; background:var(--soft); border:1px solid transparent; }
    .task-row.current { background:var(--green-soft); border-color:color-mix(in srgb,var(--green) 55%,var(--border)); }
    .task-row.current .task-name { color:var(--green); font-weight:750; }
    .task-row.ancestor { border-left:3px solid color-mix(in srgb,var(--green) 55%,transparent); }
    .state { width:10px; height:10px; border-radius:50%; margin-top:5px; background:var(--muted); }
    .state.completed { background:var(--green); }
    .state.in_progress { background:var(--blue); }
    .task-name { font-weight:600; overflow-wrap:anywhere; }
    .task-meta { color:var(--muted); font-size:11px; margin-top:2px; }
    .children { margin-left:22px; padding-left:12px; border-left:1px solid var(--border); display:flex; flex-direction:column; gap:6px; margin-top:6px; }
    .file-list { display:flex; flex-direction:column; gap:7px; }
    .file { display:grid; grid-template-columns:54px minmax(0,1fr) auto; gap:10px; align-items:start; padding:10px 11px; background:var(--soft); border-radius:9px; }
    .action { font-size:11px; font-weight:700; border:1px solid var(--border); border-radius:999px; text-align:center; padding:2px 6px; }
    .action.add { color:var(--green); } .action.modify,.action.update { color:var(--blue); } .action.delete { color:var(--red); }
    .path { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:12px; overflow-wrap:anywhere; }
    .rel { color:var(--muted); font-size:11px; margin-top:3px; }
    .empty { padding:18px 3px; color:var(--muted); }
    .notice { margin-top:10px; padding:9px 10px; border-radius:8px; background:var(--soft); color:var(--muted); font-size:12px; }
    .error { color:var(--red); }
    @media(max-width:760px){ .grid3{grid-template-columns:1fr;} .top{flex-direction:column;} .file{grid-template-columns:50px minmax(0,1fr);} .file-time{display:none;} }
  </style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>Local AI Development Bridge</h1>
      <div class="subtitle">任务执行监视器 · 只展示当前最需要看的四类信息</div>
    </div>
    <div class="live"><span class="dot" id="live-dot"></span><span id="live-text">正在连接…</span></div>
  </div>

  <section class="panel section">
    <div class="section-head"><h2>AI 输出</h2><span class="small" id="ai-source">等待遥测</span></div>
    <div class="grid3">
      <div class="metric"><div class="label">近 1 min 输出量</div><div class="value" id="ai-1m">—</div><div class="detail" id="ai-1m-detail">—</div></div>
      <div class="metric"><div class="label">近 5 min 输出量</div><div class="value" id="ai-5m">—</div><div class="detail" id="ai-5m-detail">—</div></div>
      <div class="metric"><div class="label">输出速度（TPS）</div><div class="value" id="ai-tps">—</div><div class="detail" id="ai-tps-detail">—</div></div>
    </div>
    <div class="notice" id="ai-note">当前客户端尚未提供助手 token 遥测。这里不会用提示词长度或工具文本伪造 TPS。</div>
  </section>

  <section class="panel section">
    <div class="section-head"><h2>阶段用时</h2><span class="small">由任务状态时间戳自动计算</span></div>
    <div class="grid3">
      <div class="stage" id="stage-big"><div class="label">大目标</div><div class="name" id="stage-big-name">—</div><div class="time" id="stage-big-time">—</div></div>
      <div class="stage" id="stage-mid"><div class="label">分目标</div><div class="name" id="stage-mid-name">—</div><div class="time" id="stage-mid-time">—</div></div>
      <div class="stage" id="stage-small"><div class="label">小目标</div><div class="name" id="stage-small-name">—</div><div class="time" id="stage-small-time">—</div></div>
    </div>
  </section>

  <section class="panel section">
    <div class="section-head"><h2>任务规划与分级</h2><span class="small">绿色 = 当前正在处理的最细分支</span></div>
    <div class="tree" id="task-tree"></div>
  </section>

  <section class="panel section">
    <div class="section-head"><h2>文件变更</h2><span class="small" id="file-count">0 个</span></div>
    <div class="file-list" id="file-list"></div>
  </section>
</main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const setText = (id, value) => { const el=$(id); if(el) el.textContent=value == null || value === '' ? '—' : String(value); };
  const fmtTokens = value => {
    const n=Number(value||0); if(!Number.isFinite(n)) return '—';
    if(n>=1000000) return `${(n/1000000).toFixed(n>=10000000?1:2)}M tok`;
    if(n>=1000) return `${(n/1000).toFixed(n>=10000?1:2)}k tok`;
    return `${Math.round(n)} tok`;
  };
  const fmtDuration = ms => {
    const value=Number(ms); if(!Number.isFinite(value) || value<0) return '—';
    const total=Math.floor(value/1000); const h=Math.floor(total/3600); const m=Math.floor((total%3600)/60); const s=total%60;
    if(h>0) return `${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
    return `${m}m ${String(s).padStart(2,'0')}s`;
  };
  const liveElapsed = task => {
    if(!task || !task.started_at) return null;
    const start=Date.parse(task.started_at); if(!Number.isFinite(start)) return task.elapsed_ms;
    const end=task.completed_at ? Date.parse(task.completed_at) : Date.now();
    return Number.isFinite(end) ? Math.max(0,end-start) : task.elapsed_ms;
  };
  const fmtTime = value => {
    if(!value) return '';
    const d=new Date(value); return Number.isNaN(d.getTime()) ? '' : d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  };

  function renderAI(ai){
    const available=Boolean(ai && ai.available);
    const one=ai&&ai.one_minute||{}; const five=ai&&ai.five_minutes||{};
    setText('ai-1m', available ? fmtTokens(one.output_tokens) : '未接入');
    setText('ai-5m', available ? fmtTokens(five.output_tokens) : '未接入');
    setText('ai-tps', available && ai.latest_tps!=null ? `${Number(ai.latest_tps).toFixed(1)} tok/s` : '未接入');
    setText('ai-1m-detail', available ? `${one.events||0} 次输出 · 平均 ${one.avg_tps==null?'—':Number(one.avg_tps).toFixed(1)+' tok/s'}` : '等待客户端自动遥测');
    setText('ai-5m-detail', available ? `${five.events||0} 次输出 · 平均 ${five.avg_tps==null?'—':Number(five.avg_tps).toFixed(1)+' tok/s'}` : '等待客户端自动遥测');
    setText('ai-tps-detail', available ? `最近更新 ${fmtTime(ai.latest_at)||'—'}` : '不使用估算值冒充真实 token');
    setText('ai-source', available ? `${ai.state||'live'} · ${ai.source||'client'}${ai.model?' · '+ai.model:''}` : '未接入 token telemetry');
    const note=$('ai-note'); note.hidden=available; if(!available) note.textContent=ai&&ai.note||'当前客户端尚未提供助手 token 遥测。';
  }

  function renderStages(task){
    const todos=Array.isArray(task&&task.todos)?task.todos:[]; const byId=new Map(todos.map(x=>[String(x.id),x]));
    const path=Array.isArray(task&&task.active_path)?task.active_path.map(id=>byId.get(String(id))).filter(Boolean):[];
    let big=null, mid=null, small=null;
    if(path.length===1){ big=path[0]; }
    else if(path.length===2){ big=path[0]; mid=path[1]; }
    else if(path.length>=3){ big=path[0]; mid=path[1]; small=path[path.length-1]; }
    const rows=[['big',big],['mid',mid],['small',small]];
    rows.forEach(([key,item])=>{
      setText(`stage-${key}-name`, item&&item.content||'—'); setText(`stage-${key}-time`, item?fmtDuration(liveElapsed(item)):'—');
      $(`stage-${key}`).classList.toggle('active', Boolean(item && String(item.id)===String(task.active_leaf_id)));
    });
  }

  function renderTree(task){
    const host=$('task-tree'); host.replaceChildren();
    const todos=Array.isArray(task&&task.todos)?task.todos:[]; if(!todos.length){ host.innerHTML='<div class="empty">尚无任务规划。</div>'; return; }
    const children=new Map(); todos.forEach(item=>{ const parent=item.parent_id==null?'__root__':String(item.parent_id); if(!children.has(parent)) children.set(parent,[]); children.get(parent).push(item); });
    const activeLeaf=task&&task.active_leaf_id==null?null:String(task.active_leaf_id); const activePath=new Set((task&&task.active_path||[]).map(String));
    const renderNodes=(parent,container)=>{
      (children.get(parent)||[]).forEach(item=>{
        const wrap=document.createElement('div'); wrap.className='tree-node';
        const row=document.createElement('div'); row.className='task-row';
        if(String(item.id)===activeLeaf) row.classList.add('current'); else if(activePath.has(String(item.id))) row.classList.add('ancestor');
        const dot=document.createElement('span'); dot.className='state '+(item.status||'pending');
        const body=document.createElement('div'); const name=document.createElement('div'); name.className='task-name'; name.textContent=item.content||item.id;
        const meta=document.createElement('div'); meta.className='task-meta'; const level=Number(item.level||0); meta.textContent=`${level===0?'总任务':level===1?'分任务':'小目标'} · ${item.status||'pending'}${item.started_at?' · '+fmtDuration(liveElapsed(item)):''}`;
        body.append(name,meta); const marker=document.createElement('div'); marker.className='small'; marker.textContent=String(item.id)===activeLeaf?'当前':'';
        row.append(dot,body,marker); wrap.append(row);
        const childItems=children.get(String(item.id))||[]; if(childItems.length){ const sub=document.createElement('div'); sub.className='children'; renderNodes(String(item.id),sub); wrap.append(sub); }
        container.append(wrap);
      });
    };
    renderNodes('__root__',host);
  }

  function renderFiles(payload){
    const host=$('file-list'); host.replaceChildren(); const changes=Array.isArray(payload&&payload.changes)?payload.changes.slice(0,30):[];
    setText('file-count', `${changes.length} 个`); if(!changes.length){ host.innerHTML='<div class="empty">当前没有检测到文件变更。</div>'; return; }
    changes.forEach(item=>{
      const row=document.createElement('div'); row.className='file';
      const action=document.createElement('span'); action.className='action '+(item.action||'modify'); const actionLabels={add:'新增',create:'新增',modify:'修改',update:'修改',write:'修改',delete:'删除',remove:'删除'}; action.textContent=actionLabels[item.action]||item.action_label||item.action||'修改';
      const body=document.createElement('div'); const abs=document.createElement('div'); abs.className='path'; abs.textContent=item.absolute_path||item.path||'—';
      const rel=document.createElement('div'); rel.className='rel'; rel.textContent=`[${item.workspace_id||'default'}] ${item.path||''}`; body.append(abs,rel);
      const time=document.createElement('span'); time.className='small file-time'; time.textContent=fmtTime(item.timestamp)|| (item.source==='git_status'?'当前':'');
      row.append(action,body,time); host.append(row);
    });
  }

  let lastState=null;
  function render(state){ lastState=state; renderAI(state.ai_output||{}); renderStages(state.task||{}); renderTree(state.task||{}); renderFiles(state.file_changes||{}); }
  async function refresh(){
    try{
      const res=await fetch('/api/focus',{cache:'no-store'}); if(!res.ok) throw new Error(`HTTP ${res.status}`); const state=await res.json(); render(state);
      $('live-dot').style.background='var(--green)'; setText('live-text',`已连接 · ${new Date().toLocaleTimeString()}`); $('live-text').classList.remove('error');
    }catch(err){ $('live-dot').style.background='var(--red)'; setText('live-text',`连接失败 · ${err.message||err}`); $('live-text').classList.add('error'); }
    setTimeout(refresh,1500);
  }
  setInterval(()=>{ if(lastState) renderStages(lastState.task||{}); },1000);
  refresh();
})();
</script>
</body>
</html>
