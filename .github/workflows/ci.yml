name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q bridge scripts launcher.py server.py

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan tracked files
        run: python scripts/secret_scan.py

  vscode-companion:
    name: VS Code Companion
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-companion/package-lock.json
      - name: Install Node dependencies
        run: npm ci
      - name: Compile extension
        run: npm run compile
      - name: Package VSIX
        run: npm run package -- --out local-ai-development-bridge-vscode-ci.vsix
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-companion-vsix
          path: vscode-companion/local-ai-development-bridge-vscode-ci.vsix
          if-no-files-found: error
